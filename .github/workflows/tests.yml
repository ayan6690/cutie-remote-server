name: Cutie Remote Server Tests

"on":
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CUTIE_API_KEY: test-admin-key
      CUTIE_PAIRING_CODE: test-pairing-code
      CUTIE_DATA_DIR: /tmp/cutie-test-data
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "httpx>=0.27,<0.29" pytest

      - name: Compile Python files
        run: python -m compileall -q main.py remote_queue.py firebase_store.py tests

      - name: Run all tests
        run: python -m pytest -q tests/

      - name: Run isolated queue smoke tests
        run: python tests/smoke_queue.py
